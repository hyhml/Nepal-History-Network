\u9601\uff1b\u653f\u515a\u80fd\u5426\u53c2\u653f\u548c\u4f55\u65f6\u9009\u003cbr\u003e\u4e3e\u4ecd\u7531\u56fd\u738b\u4e3b\u5bfc\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u4e66\u4e2d\u672c\u6bb5\u6ca1\u6709\u9010\u5c4a\u8bf4\u660e\u5bf9\u5370\u653f\u7b56\uff1b1950\u5e74\u5c3c\u5370\u6761\u7ea6\u53ca\u5bf9\u5370\u5ea6\u7684\u7ecf\u6d4e\u4f9d\u8d56\u6784\u6210\u957f\u671f\u5173\u003cbr\u003e\u7cfb\u80cc\u666f\u3002\u003cbr\u003e1955\u5e74\u7279\u91cc\u5e03\u6587\u75c5\u901d\u540e\u9a6c\u4ea8\u5fb7\u62c9\u7ee7\u4f4d\u3002\u65b0\u56fd\u738b\u53ea\u7b54\u5e94\u5236\u5b9a\u65b0\u5baa\u6cd5\u5e76\u4e3e\u884c\u5168\u6c11\u9009\u4e3e\uff0c\u003cbr\u003e\u738b\u5ba4\u7ee7\u7eed\u63a7\u5236\u653f\u6cbb\u8fdb\u7a0b\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u5927\u4f1a\u515a\u653f\u5e9c\uff0f\u6bd4\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5927\u4f1a\u515a\u8d62\u5f971959\u5e74\u9009\u4e3e\uff0c\u6bd4\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u4efb\u9996\u76f8\uff1b\u9a6c\u4ea8\u5fb7\u62c9\u4ecd\u4e3a\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u653f\u5e9c\u5904\u57281950\u5e74\u5c3c\u5370\u6761\u7ea6\u548c\u957f\u671f\u7ecf\u6d4e\u4f9d\u8d56\u6846\u67b6\u4e0b\uff1b\u4e66\u4e2d\u5f53\u524d\u6bb5\u843d\u672a\u53e6\u5217\u8fd9\u4e00\u5c4a\u653f\u5e9c\u003cbr\u003e\u7684\u5177\u4f53\u5bf9\u5370\u653f\u7b56\u3002\u003cbr\u003e1959\u5e74\u5b9e\u884c\u8bae\u4f1a\u9009\u4e3e\u5e76\u6210\u7acb\u5927\u4f1a\u515a\u653f\u5e9c\uff1b1960\u5e74\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\uff0c\u7ec8\u6b62\u003cbr\u003e\u8fd9\u4e00\u6c11\u9009\u653f\u5e9c\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u5927\u4f1a\u515a\u653f\u5e9c\uff0f\u6bd4\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5927\u4f1a\u515a\u8d62\u5f971959\u5e74\u9009\u4e3e\uff0c\u6bd4\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u4efb\u9996\u76f8\uff1b\u9a6c\u4ea8\u5fb7\u62c9\u4ecd\u4e3a\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u653f\u5e9c\u5904\u57281950\u5e74\u5c3c\u5370\u6761\u7ea6\u548c\u957f\u671f\u7ecf\u6d4e\u4f9d\u8d56\u6846\u67b6\u4e0b\uff1b\u4e66\u4e2d\u5f53\u524d\u6bb5\u843d\u672a\u53e6\u5217\u8fd9\u4e00\u5c4a\u653f\u5e9c\u003cbr\u003e\u7684\u5177\u4f53\u5bf9\u5370\u653f\u7b56\u3002\u003cbr\u003e1959\u5e74\u5b9e\u884c\u8bae\u4f1a\u9009\u4e3e\u5e76\u6210\u7acb\u5927\u4f1a\u515a\u653f\u5e9c\uff1b1960\u5e74\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\uff0c\u7ec8\u6b62\u003cbr\u003e\u8fd9\u4e00\u6c11\u9009\u653f\u5e9c\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\uff0f\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\u3001\u7981\u6b62\u653f\u515a\u5e76\u5efa\u7acb\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff1b\u9996\u76f8\u548c\u653f\u5e9c\u670d\u4ece\u738b\u5ba4\u6743\u529b\u003cbr\u003e\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u4e66\u4e2d\u5c061950\u5e74\u6761\u7ea6\u30011959\u5e74\u7518\u8fbe\u57fa\u6cb3\u534f\u5b9a\u7b49\u5217\u4e3a\u5370\u5ea6\u5f71\u54cd\u5c3c\u6cca\u5c14\u653f\u6cbb\u7ecf\u6d4e\u7684\u957f\u003cbr\u003e\u671f\u673a\u5236\uff1b\u8f9b\u683c\u7b49\u53cd\u5bf9\u6d3e\u628a\u5370\u5ea6\u89c6\u4e3a\u738b\u5ba4\u7684\u5916\u90e8\u652f\u6301\u8005\u3002\u003cbr\u003e1960\u5e74\u56fd\u738b\u5ba3\u5e03\u4e00\u5207\u653f\u515a\u975e\u6cd5\uff0c\u5c3c\u5171\u548c\u5176\u4ed6\u515a\u6d3e\u906d\u7981\uff1b\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\u4ee5\u541b\u4e3b\u96c6\u003cbr\u003e\u6743\u4e3a\u57fa\u672c\u7279\u5f81\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\uff0f\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\u3001\u7981\u6b62\u653f\u515a\u5e76\u5efa\u7acb\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff1b\u9996\u76f8\u548c\u653f\u5e9c\u670d\u4ece\u738b\u5ba4\u6743\u529b\u003cbr\u003e\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u4e66\u4e2d\u5c061950\u5e74\u6761\u7ea6\u30011959\u5e74\u7518\u8fbe\u57fa\u6cb3\u534f\u5b9a\u7b49\u5217\u4e3a\u5370\u5ea6\u5f71\u54cd\u5c3c\u6cca\u5c14\u653f\u6cbb\u7ecf\u6d4e\u7684\u957f\u003cbr\u003e\u671f\u673a\u5236\uff1b\u8f9b\u683c\u7b49\u53cd\u5bf9\u6d3e\u628a\u5370\u5ea6\u89c6\u4e3a\u738b\u5ba4\u7684\u5916\u90e8\u652f\u6301\u8005\u3002\u003cbr\u003e1960\u5e74\u56fd\u738b\u5ba3\u5e03\u4e00\u5207\u653f\u515a\u975e\u6cd5\uff0c\u5c3c\u5171\u548c\u5176\u4ed6\u515a\u6d3e\u906d\u7981\uff1b\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\u4ee5\u541b\u4e3b\u96c6\u003cbr\u003e\u6743\u4e3a\u57fa\u672c\u7279\u5f81\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\uff0f\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u7ee7\u4f4d\u540e\u5ef6\u7eed\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff0c\u7531\u56fd\u738b\u4efb\u547d\u9996\u76f8\u548c\u5185\u9601\uff1b\u653f\u515a\u4ecd\u53d7\u7981\u9650\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u63d0\u51fa\u201c\u548c\u5e73\u533a\u201d\u3001\u9650\u5236\u5916\u56fd\u4eba\u5728\u5c3c\u5c31\u4e1a\uff0c\u5e76\u53d1\u5c55\u540c\u4e2d\u56fd\u7684\u5de5\u7a0b\u548c\u519b\u8d38\u5173\u7cfb\uff1b\u8fd9\u003cbr\u003e\u4e9b\u653f\u7b56\u4f7f\u5c3c\u5370\u77db\u76fe\u9010\u6b65\u4e0a\u5347\u3002\u003cbr\u003e\u6bd4\u5170\u5fb7\u62c9\u65f6\u671f\u738b\u5ba4\u653f\u6743\u5ef6\u7eed\uff1b\u4e66\u4e2d\u628a1975\u5e74\u201c\u548c\u5e73\u533a\u201d\u4e3b\u5f20\u30011987\u5e74\u5916\u56fd\u4eba\u5c31\u003cbr\u003e\u4e1a\u8bb8\u53ef\u548c\u5c3c\u4e2d\u5408\u4f5c\u5217\u4e3a\u5c3c\u5370\u5173\u7cfb\u7d27\u5f20\u7684\u80cc\u666f\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\uff0f\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u7ee7\u4f4d\u540e\u5ef6\u7eed\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff0c\u7531\u56fd\u738b\u4efb\u547d\u9996\u76f8\u548c\u5185\u9601\uff1b\u653f\u515a\u4ecd\u53d7\u7981\u9650\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u63d0\u51fa\u201c\u548c\u5e73\u533a\u201d\u3001\u9650\u5236\u5916\u56fd\u4eba\u5728\u5c3c\u5c31\u4e1a\uff0c\u5e76\u53d1\u5c55\u540c\u4e2d\u56fd\u7684\u5de5\u7a0b\u548c\u519b\u8d38\u5173\u7cfb\uff1b\u8fd9\u003cbr\u003e\u4e9b\u653f\u7b56\u4f7f\u5c3c\u5370\u77db\u76fe\u9010\u6b65\u4e0a\u5347\u3002\u003cbr\u003e\u6bd4\u5170\u5fb7\u62c9\u65f6\u671f\u738b\u5ba4\u653f\u6743\u5ef6\u7eed\uff1b\u4e66\u4e2d\u628a1975\u5e74\u201c\u548c\u5e73\u533a\u201d\u4e3b\u5f20\u30011987\u5e74\u5916\u56fd\u4eba\u5c31\u003cbr\u003e\u4e1a\u8bb8\u53ef\u548c\u5c3c\u4e2d\u5408\u4f5c\u5217\u4e3a\u5c3c\u5370\u5173\u7cfb\u7d27\u5f20\u7684\u80cc\u666f\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\uff0f\u738b\u5ba4\u653f\u5e9c\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\u638c\u63e1\u56fd\u5bb6\u6743\u529b\uff0c\u9a6c\u91cc\u5947\u00b7\u66fc\u00b7\u8f9b\u683c\u4efb\u9996\u76f8\uff1b1990\u5e74\u6297\u8bae\u6269\u5927\u540e\u6539\u4efb\u6d1b\u003cbr\u003e\u80af\u5fb7\u62c9\u00b7\u5df4\u54c8\u675c\u5c14\u00b7\u660c\u5fb7\uff0c\u6700\u7ec8\u540c\u610f\u7ed3\u675f\u65e0\u515a\u6d3e\u4f53\u5236\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u4ee5\u8d38\u6613\u4e0e\u8fc7\u5883\u534f\u5b9a\u5230\u671f\u4e3a\u7531\u5173\u95ed\u5927\u90e8\u5206\u8fc7\u5883\u7ad9\uff0c\u5f62\u6210\u8d38\u6613\u7981\u8fd0\uff1b\u7ecf\u6d4e\u51b2\u51fb\u4e0e\u53cd\u738b\u5ba4\u003cbr\u003e\u8fd0\u52a8\u76f8\u4e92\u53e0\u52a0\u3002\u003cbr\u003e1989\u5e743\u670823\u65e5\u5370\u5ea6\u5173\u95ed\u5927\u90e8\u5206\u5c3c\u6cca\u5c14\u8fd0\u8f93\u8fc7\u5883\u7ad9\u30021990\u5e74\u6297\u8bae\u5347\u7ea7\u540e\uff0c\u6bd4\u003cbr\u003e\u5170\u5fb7\u62c9\u540c\u610f\u89e3\u9664\u515a\u7981\u3001\u89e3\u6563\u738b\u5ba4\u653f\u5e9c\u5e76\u4e3e\u884c\u5927\u9009\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\uff0f\u738b\u5ba4\u653f\u5e9c\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\u638c\u63e1\u56fd\u5bb6\u6743\u529b\uff0c\u9a6c\u91cc\u5947\u00b7\u66fc\u00b7\u8f9b\u683c\u4efb\u9996\u76f8\uff1b1990\u5e74\u6297\u8bae\u6269\u5927\u540e\u6539\u4efb\u6d1b\u003cbr\u003e\u80af\u5fb7\u62c9\u00b7\u5df4\u54c8\u675c\u5c14\u00b7\u660c\u5fb7\uff0c\u6700\u7ec8\u540c\u610f\u7ed3\u675f\u65e0\u515a\u6d3e\u4f53\u5236\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u4ee5\u8d38\u6613\u4e0e\u8fc7\u5883\u534f\u5b9a\u5230\u671f\u4e3a\u7531\u5173\u95ed\u5927\u90e8\u5206\u8fc7\u5883\u7ad9\uff0c\u5f62\u6210\u8d38\u6613\u7981\u8fd0\uff1b\u7ecf\u6d4e\u51b2\u51fb\u4e0e\u53cd\u738b\u5ba4\u003cbr\u003e\u8fd0\u52a8\u76f8\u4e92\u53e0\u52a0\u3002\u003cbr\u003e1989\u5e743\u670823\u65e5\u5370\u5ea6\u5173\u95ed\u5927\u90e8\u5206\u5c3c\u6cca\u5c14\u8fd0\u8f93\u8fc7\u5883\u7ad9\u30021990\u5e74\u6297\u8bae\u5347\u7ea7\u540e\uff0c\u6bd4\u003cbr\u003e\u5170\u5fb7\u62c9\u540c\u610f\u89e3\u9664\u515a\u7981\u3001\u89e3\u6563\u738b\u5ba4\u653f\u5e9c\u5e76\u4e3e\u884c\u5927\u9009\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u591a\u515a\u8054\u5408\u4e34\u65f6\u653f\u5e9c\uff0f\u5df4\u7279\u62c9\u4f0a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u8f6c\u4e3a\u7acb\u5baa\u56fd\u738b\uff1b\u5927\u4f1a\u515a\u4e3b\u5e2d\u514b\u00b7\u666e\u00b7\u5df4\u7279\u62c9\u4f0a\u9886\u5bfc\u7531\u5927\u4f1a\u515a\u3001\u5de6\u7ffc\u8054\u5408\u9635\u7ebf\u3001\u003cbr\u003e\u738b\u5ba4\u63d0\u540d\u8005\u548c\u77e5\u8bc6\u5206\u5b50\u7ec4\u6210\u7684\u4e34\u65f6\u653f\u5e9c\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e1990\u5e746\u6708\u5df4\u7279\u62c9\u4f0a\u653f\u5e9c\u540c\u5370\u5ea6\u8fbe\u6210\u534f\u8bae\uff0c\u5370\u5ea6\u53d6\u6d88\u8d38\u6613\u7981\u8fd0\uff0c\u4e24\u56fd\u6062\u590d\u8d38\u6613\u4e0e\u8fc7\u003cbr\u003e\u5883\u5b89\u6392\u3002\u003cbr\u003e1990\u5e744\u6708\u56fd\u738b\u5e9f\u6b62\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff1b\u5df4\u7279\u62c9\u4f0a\u4e34\u65f6\u653f\u5e9c\u8d1f\u8d23\u8d77\u8349\u65b0\u5baa\u6cd5\u5e76\u7b79\u5907\u003cbr\u003e\u591a\u515a\u8bae\u4f1a\u9009\u4e3e\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u591a\u515a\u8054\u5408\u4e34\u65f6\u653f\u5e9c\uff0f\u5df4\u7279\u62c9\u4f0a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u8f6c\u4e3a\u7acb\u5baa\u56fd\u738b\uff1b\u5927\u4f1a\u515a\u4e3b\u5e2d\u514b\u00b7\u666e\u00b7\u5df4\u7279\u62c9\u4f0a\u9886\u5bfc\u7531\u5927\u4f1a\u515a\u3001\u5de6\u7ffc\u8054\u5408\u9635\u7ebf\u3001\u003cbr\u003e\u738b\u5ba4\u63d0\u540d\u8005\u548c\u77e5\u8bc6\u5206\u5b50\u7ec4\u6210\u7684\u4e34\u65f6\u653f\u5e9c\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e1990\u5e746\u6708\u5df4\u7279\u62c9\u4f0a\u653f\u5e9c\u540c\u5370\u5ea6\u8fbe\u6210\u534f\u8bae\uff0c\u5370\u5ea6\u53d6\u6d88\u8d38\u6613\u7981\u8fd0\uff0c\u4e24\u56fd\u6062\u590d\u8d38\u6613\u4e0e\u8fc7\u003cbr\u003e\u5883\u5b89\u6392\u3002\u003cbr\u003e1990\u5e744\u6708\u56fd\u738b\u5e9f\u6b62\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff1b\u5df4\u7279\u62c9\u4f0a\u4e34\u65f6\u653f\u5e9c\u8d1f\u8d23\u8d77\u8349\u65b0\u5baa\u6cd5\u5e76\u7b79\u5907\u003cbr\u003e\u591a\u515a\u8bae\u4f1a\u9009\u4e3e\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u5927\u4f1a\u515a\u653f\u5e9c\uff0f\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5927\u4f1a\u515a\u5728205\u5e2d\u4e2d\u8d62\u5f97110\u5e2d\uff0c\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u4efb\u9996\u76f8\uff1b\u6bd4\u5170\u5fb7\u62c9\u4e3a\u7acb\u5baa\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u4e66\u4e2d\u8ba4\u4e3a\u653f\u5e9c\u5bf9\u5916\u653f\u7b56\u4ecd\u501a\u4ed7\u5370\u5ea6\uff1b\u653f\u5e9c\u9700\u5904\u7406\u5c3c\u5370\u7ecf\u6d4e\u50f5\u5c40\uff0c\u5e76\u5ef6\u7eed\u4e0e\u5370\u5ea6\u7684\u8d38\u6613\u548c\u003cbr\u003e\u8fc7\u5883\u5b89\u6392\u3002\u003cbr\u003e\u5927\u4f1a\u515a\u653f\u5e9c\u5b9e\u884c\u81ea\u7531\u653e\u4efb\u548c\u79c1\u6709\u5316\u653f\u7b56\u3002\u4e66\u4e2d\u628a\u7ecf\u6d4e\u5371\u673a\u3001\u4eb2\u5370\u653f\u7b56\u53ca\u672a\u80fd\u5151\u73b0\u6539\u5584\u6c11\u003cbr\u003e\u751f\u7684\u627f\u8bfa\u5217\u4e3a\u6c11\u4f17\u4e0d\u6ee1\u7684\u91cd\u8981\u539f\u56e0\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u5927\u4f1a\u515a\u653f\u5e9c\uff0f\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5927\u4f1a\u515a\u5728205\u5e2d\u4e2d\u8d62\u5f97110\u5e2d\uff0c\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u4efb\u9996\u76f8\uff1b\u6bd4\u5170\u5fb7\u62c9\u4e3a\u7acb\u5baa\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u4e66\u4e2d\u8ba4\u4e3a\u653f\u5e9c\u5bf9\u5916\u653f\u7b56\u4ecd\u501a\u4ed7\u5370\u5ea6\uff1b\u653f\u5e9c\u9700\u5904\u7406\u5c3c\u5370\u7ecf\u6d4e\u50f5\u5c40\uff0c\u5e76\u5ef6\u7eed\u4e0e\u5370\u5ea6\u7684\u8d38\u6613\u548c\u003cbr\u003e\u8fc7\u5883\u5b89\u6392\u3002\u003cbr\u003e\u5927\u4f1a\u515a\u653f\u5e9c\u5b9e\u884c\u81ea\u7531\u653e\u4efb\u548c\u79c1\u6709\u5316\u653f\u7b56\u3002\u4e66\u4e2d\u628a\u7ecf\u6d4e\u5371\u673a\u3001\u4eb2\u5370\u653f\u7b56\u53ca\u672a\u80fd\u5151\u73b0\u6539\u5584\u6c11\u003cbr\u003e\u751f\u7684\u627f\u8bfa\u5217\u4e3a\u6c11\u4f17\u4e0d\u6ee1\u7684\u91cd\u8981\u539f\u56e0\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u653f\u5e9c\uff0f\u963f\u8fea\u5361\u91cc\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u6210\u4e3a\u8bae\u4f1a\u7b2c\u4e00\u5927\u515a\uff0c\u66fc\u00b7\u83ab\u6c49\u00b7\u963f\u8fea\u5361\u91cc\u5728\u56fd\u738b\u9080\u8bf7\u4e0b\u7ec4\u6210\u5c11\u6570\u6d3e\u653f\u003cbr\u003e\u5e9c\u5e76\u4efb\u9996\u76f8\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u653f\u5e9c\u8bd5\u56fe\u7ea0\u6b63\u524d\u4e00\u5c4a\u653f\u5e9c\u7684\u4eb2\u5370\u653f\u7b56\uff0c\u4f46\u4e66\u4e2d\u8ba4\u4e3a\u4ecd\u65e0\u6cd5\u6446\u8131\u5370\u5ea6\u5f71\u54cd\u3002\u003cbr\u003e1994\u5e7411\u6708\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u7ec4\u6210\u5c11\u6570\u6d3e\u653f\u5e9c\uff1b1995\u5e749\u6708\u5927\u4f1a\u515a\u8054\u5408\u5176\u4ed6\u003cbr\u003e\u515a\u6d3e\u901a\u8fc7\u4e0d\u4fe1\u4efb\u6848\uff0c\u963f\u8fea\u5361\u91cc\u653f\u5e9c\u4e0b\u53f0\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u653f\u5e9c\uff0f\u963f\u8fea\u5361\u91cc\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u6210\u4e3a\u8bae\u4f1a\u7b2c\u4e00\u5927\u515a\uff0c\u66fc\u00b7\u83ab\u6c49\u00b7\u963f\u8fea\u5361\u91cc\u5728\u56fd\u738b\u9080\u8bf7\u4e0b\u7ec4\u6210\u5c11\u6570\u6d3e\u653f\u003cbr\u003e\u5e9c\u5e76\u4efb\u9996\u76f8\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u653f\u5e9c\u8bd5\u56fe\u7ea0\u6b63\u524d\u4e00\u5c4a\u653f\u5e9c\u7684\u4eb2\u5370\u653f\u7b56\uff0c\u4f46\u4e66\u4e2d\u8ba4\u4e3a\u4ecd\u65e0\u6cd5\u6446\u8131\u5370\u5ea6\u5f71\u54cd\u3002\u003cbr\u003e1994\u5e7411\u6708\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u7ec4\u6210\u5c11\u6570\u6d3e\u653f\u5e9c\uff1b1995\u5e749\u6708\u5927\u4f1a\u515a\u8054\u5408\u5176\u4ed6\u003cbr\u003e\u515a\u6d3e\u901a\u8fc7\u4e0d\u4fe1\u4efb\u6848\uff0c\u963f\u8fea\u5361\u91cc\u653f\u5e9c\u4e0b\u53f0\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u5927\u4f1a\u515a\u8054\u5408\u653f\u5e9c\uff0f\u5fb7\u4e4c\u5e15\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u8c22\u5c14\u00b7\u5df4\u54c8\u675c\u5c14\u00b7\u5fb7\u4e4c\u5e15\u9886\u5bfc\u5927\u4f1a\u515a\u8054\u5408\u653f\u5e9c\uff1b\u5176\u540e\u8bae\u4f1a\u653f\u5e9c\u591a\u6b21\u66f4\u8fed\uff0c\u6bd4\u5170\u5fb7\u62c9\u4ecd\u4e3a\u003cbr\u003e\u7acb\u5baa\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e1996\u5e74\u521d\u653f\u5e9c\u540c\u5370\u5ea6\u7b7e\u7f72\u9a6c\u54c8\u5361\u5229\u6cb3\u7efc\u5408\u5f00\u53d1\u6761\u7ea6\uff1b\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u201c40\u70b9\u8981\u6c42\u201d\u003cbr\u003e\u628a\u5e9f\u9664\u5bf9\u5370\u4e0d\u5e73\u7b49\u6761\u7ea6\u3001\u7ba1\u5236\u5f00\u653e\u8fb9\u754c\u5217\u4e3a\u6c11\u65cf\u95ee\u9898\u3002\u003cbr\u003e1995\u5e749\u6708\u5927\u4f1a\u515a\u91cd\u65b0\u7ec4\u9601\u5e76\u5bf9\u6fc0\u8fdb\u5de6\u6d3e\u91c7\u53d6\u5f3a\u786c\u63 3e\u201c9\u00b711\u201d\u540e\u5370\u5ea6\u516c\u5f00\u628a\u5c3c\u5171\uff08\u6bdb\uff09\u89c6\u4e3a\u6050\u6016\u7ec4\u7ec7\u3001\u52a0\u5f3a\u8fb9\u5883\u90e8\u7f72\uff0c\u5e76\u4e0e\u7f8e\u56fd\u4e00\u9053\u652f\u003cbr\u003e\u6301\u5c3c\u6cca\u5c14\u653f\u5e9c\u4ee5\u6b66\u529b\u5e94\u5bf9\u5c3c\u5171\uff08\u6bdb\uff09\u3002\u003cbr\u003e2001\u5e74\u738b\u5bab\u8840\u6848\u540e\u8d3e\u5357\u5fb7\u62c9\u7ee7\u4f4d\u3002\u548c\u8c08\u7834\u88c2\u540e\uff0c\u738b\u5ba4\u3001\u653f\u5e9c\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u6218\u4e89\u5347\u003cbr\u003e\u7ea7\uff0c\u56fd\u738b\u9010\u6b65\u6269\u5927\u5bf9\u653f\u5e9c\u548c\u519b\u961f\u7684\u63a7\u5236\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u8d3e\u5357\u5fb7\u62c9\u56fd\u738b\uff0f\u8bae\u4f1a\u653f\u5e9c\u53d7\u538b\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u8d3e\u5357\u5fb7\u62c9\u7ee7\u4f4d\uff1b\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u3001\u5fb7\u4e4c\u5e15\u7b49\u5148\u540e\u4efb\u9996\u76f8\u30022002\u5e74\u540e\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\u003cbr\u003e\u5e76\u4efb\u547d\u653f\u5e9c\uff0c\u738b\u6743\u4e0d\u65ad\u6269\u5f20\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u201c9\u00b711\u201d\u540e\u5370\u5ea6\u516c\u5f00\u628a\u5c3c\u5171\uff08\u6bdb\uff09\u89c6\u4e3a\u6050\u6016\u7ec4\u7ec7\u3001\u52a0\u5f3a\u8fb9\u5883\u90e8\u7f72\uff0c\u5e76\u4e0e\u7f8e\u56fd\u4e00\u9053\u652f\u003cbr\u003e\u6301\u5c3c\u6cca\u5c14\u653f\u5e9c\u4ee5\u6b66\u529b\u5e94\u5bf9\u5c3c\u5171\uff08\u6bdb\uff09\u3002\u003cbr\u003e2001\u5e74\u738b\u5bab\u8840\u6848\u540e\u8d3e\u5357\u5fb7\u62c9\u7ee7\u4f4d\u3002\u548c\u8c08\u7834\u88c2\u540e\uff0c\u738b\u5ba4\u3001\u653f\u5e9c\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u6218\u4e89\u5347\u003cbr\u003e\u7ea7\uff0c\u56fd\u738b\u9010\u6b65\u6269\u5927\u5bf9\u653f\u5e9c\u548c\u519b\u961f\u7684\u63a7\u5236\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u8d3e\u5357\u5fb7\u62c9\u56fd\u738b\u76f4\u63a5\u7edf\u6cbb\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u8d3e\u5357\u5fb7\u62c9\u89e3\u9664\u653f\u5e9c\u5e76\u5b9e\u884c\u76f4\u63a5\u7edf\u6cbb\uff1b\u4e03\u515a\u8054\u76df\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u8f6c\u5411\u8054\u5408\u53cd\u5bf9\u738b\u6743\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u4e0d\u652f\u6301\u56fd\u738b\u957f\u671f\u76f4\u63a5\u7edf\u6cbb\uff1b\u4e03\u515a\u8054\u76df\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u63a5\u89e6\u548c\u201c\u5341\u4e8c\u70b9\u534f\u8bae\u201d\u5728\u5370\u5ea6\u003cbr\u003e\u8fdb\u884c\uff0c\u5370\u5ea6\u6210\u4e3a\u548c\u8c08\u4e0e\u6743\u529b\u91cd\u7ec4\u7684\u91cd\u8981\u5916\u90e8\u573a\u57df\u3002\u003cbr\u003e2005\u5e74\u56fd\u738b\u653f\u53d8\u540e\uff0c\u5c3c\u5171\uff08\u6bdb\uff09\u540c\u4e03\u515a\u8054\u76df\u9010\u6b65\u5f62\u6210\u53cd\u738b\u6743\u5408\u4f5c\uff1b2006\u5e74\u4eba\u6c11\u003cbr\u003e\u8fd0\u52a8\u8feb\u4f7f\u56fd\u738b\u6062\u590d\u8bae\u4f1a\u5e76\u4ea4\u8fd8\u6743\u529b\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u8d3e\u5357\u5fb7\u62c9\u56fd\u738b\u76f4\u63a5\u7edf\u6cbb\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u8d3e\u5357\u5fb7\u62c9\u89e3\u9664\u653f\u5e9c\u5e76\u5b9e\u884c\u76f4\u63a5\u7edf\u6cbb\uff1b\u4e03\u515a\u8054\u76df\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u8f6c\u5411\u8054\u5408\u53cd\u5bf9\u738b\u6743\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u4e0d\u652f\u6301\u56fd\u738b\u957f\u671f\u76f4\u63a5\u7edf\u6cbb\uff1b\u4e03\u515a\u8054\u76df\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u63a5\u89e6\u548c\u201c\u5341\u4e8c\u70b9\u534f\u8bae\u201d\u5728\u5370\u5ea6\u003cbr\u003e\u8fdb\u884c\uff0c\u5370\u5ea6\u6210\u4e3a\u548c\u8c08\u4e0e\u6743\u529b\u91cd\u7ec4\u7684\u91cd\u8981\u5916\u90e8\u573a\u57df\u3002\u003cbr\u003e2005\u5e74\u56fd\u738b\u653f\u53d8\u540e\uff0c\u5c3c\u5171\uff08\u6bdb\uff09\u540c\u4e03\u515a\u8054\u76df\u9010\u6b65\u5f62\u6210\u53cd\u738b\u6743\u5408\u4f5c\uff1b2006\u5e74\u4eba\u6c11\u003cbr\u003e\u8fd0\u52a8\u8feb\u4f7f\u56fd\u738b\u6062\u590d\u8bae\u4f1a\u5e76\u4ea4\u8fd8\u6743\u529b\u3002\u003cextra\u003e\u003c\u002fextra\u003e",null,"\u003cb\u003e\u4e03\u515a\u8054\u76df\u653f\u5e9c\uff0f\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9886\u5bfc\u4e03\u515a\u8054\u76df\u653f\u5e9c\uff1b\u56fd\u738b\u6743\u529b\u88ab\u89e3\u9664\u3002\u5c3c\u5171\uff08\u6bdb\uff09\u7b7e\u7f72\u548c\u5e73\u534f\u8bae\u3001\u8fdb\u003cbr\u003e\u5165\u4e34\u65f6\u8bae\u4f1a\u5e76\u53c2\u52a0\u4e34\u65f6\u653f\u5e9c\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u652f\u6301\u8bae\u4f1a\u6c11\u4e3b\u6846\u67b6\uff0c\u540c\u65f6\u5bc6\u5207\u5f71\u54cd\u548c\u5e73\u8fdb\u7a0b\uff1b\u5c3c\u5171\uff08\u6bdb\uff09\u4e0e\u5370\u5ea6\u4e4b\u95f4\u4ece\u6b66\u88c5\u65f6\u671f\u7684\u003cbr\u003e\u538b\u5236\u8f6c\u4e3a\u516c\u5f00\u653f\u6cbb\u4ea4\u5f80\u3002\u003cbr\u003e2006\u5e74\u4e03\u515a\u8054\u76df\u638c\u6743\u540e\u540c\u5c3c\u5171\uff08\u6bdb\uff09\u5c55\u5f00\u7b2c\u4e09\u6b21\u548c\u8c08\uff0c\u7b7e\u7f72\u548c\u5e73\u534f\u8bae\uff1b\u4e34\u65f6\u5baa\u6cd5\u628a\u003cbr\u003e\u56fd\u5bb6\u5143\u9996\u804c\u80fd\u6682\u4ea4\u9996\u76f8\u884c\u4f7f\u3002\u003cextra\u003e\u003c\u002fextra\u003e","\u003cb\u003e\u4e03\u515a\u8054\u76df\u653f\u5e9c\uff0f\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9886\u5bfc\u4e03\u515a\u8054\u76df\u653f\u5e9c\uff1b\u56fd\u738b\u6743\u529b\u88ab\u89e3\u9664\u3002\u5c3c\u5171\uff08\u6bdb\uff09\u7b7e\u7f72\u548c\u5e73\u534f\u8bae\u3001\u8 784\u6210\u957f\u671f\u5173\u003cbr\u003e\u7cfb\u80cc\u666f\u3002\u003cbr\u003e1955\u5e74\u7279\u91cc\u5e03\u6587\u75c5\u901d\u540e\u9a6c\u4ea8\u5fb7\u62c9\u7ee7\u4f4d\u3002\u65b0\u56fd\u738b\u53ea\u7b54\u5e94\u5236\u5b9a\u65b0\u5baa\u6cd5\u5e76\u4e3e\u884c\u5168\u6c11\u9009\u4e3e\uff0c\u003cbr\u003e\u738b\u5ba4\u7ee7\u7eed\u63a7\u5236\u653f\u6cbb\u8fdb\u7a0b\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u5927\u4f1a\u515a\u653f\u5e9c\uff0f\u6bd4\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5927\u4f1a\u515a\u8d62\u5f971959\u5e74\u9009\u4e3e\uff0c\u6bd4\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u4efb\u9996\u76f8\uff1b\u9a6c\u4ea8\u5fb7\u62c9\u4ecd\u4e3a\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u653f\u5e9c\u5904\u57281950\u5e74\u5c3c\u5370\u6761\u7ea6\u548c\u957f\u671f\u7ecf\u6d4e\u4f9d\u8d56\u6846\u67b6\u4e0b\uff1b\u4e66\u4e2d\u5f53\u524d\u6bb5\u843d\u672a\u53e6\u5217\u8fd9\u4e00\u5c4a\u653f\u5e9c\u003cbr\u003e\u7684\u5177\u4f53\u5bf9\u5370\u653f\u7b56\u3002\u003cbr\u003e1959\u5e74\u5b9e\u884c\u8bae\u4f1a\u9009\u4e3e\u5e76\u6210\u7acb\u5927\u4f1a\u515a\u653f\u5e9c\uff1b1960\u5e74\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\uff0c\u7ec8\u6b62\u003cbr\u003e\u8fd9\u4e00\u6c11\u9009\u653f\u5e9c\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\uff0f\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u9a6c\u4ea8\u5fb7\u62c9\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\u3001\u7981\u6b62\u653f\u515a\u5e76\u5efa\u7acb\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff1b\u9996\u76f8\u548c\u653f\u5e9c\u670d\u4ece\u738b\u5ba4\u6743\u529b\u003cbr\u003e\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u4e66\u4e2d\u5c061950\u5e74\u6761\u7ea6\u30011959\u5e74\u7518\u8fbe\u57fa\u6cb3\u534f\u5b9a\u7b49\u5217\u4e3a\u5370\u5ea6\u5f71\u54cd\u5c3c\u6cca\u5c14\u653f\u6cbb\u7ecf\u6d4e\u7684\u957f\u003cbr\u003e\u671f\u673a\u5236\uff1b\u8f9b\u683c\u7b49\u53cd\u5bf9\u6d3e\u628a\u5370\u5ea6\u89c6\u4e3a\u738b\u5ba4\u7684\u5916\u90e8\u652f\u6301\u8005\u3002\u003cbr\u003e1960\u5e74\u56fd\u738b\u5ba3\u5e03\u4e00\u5207\u653f\u515a\u975e\u6cd5\uff0c\u5c3c\u5171\u548c\u5176\u4ed6\u515a\u6d3e\u906d\u7981\uff1b\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\u4ee5\u541b\u4e3b\u96c6\u003cbr\u003e\u6743\u4e3a\u57fa\u672c\u7279\u5f81\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\uff0f\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u7ee7\u4f4d\u540e\u5ef6\u7eed\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff0c\u7531\u56fd\u738b\u4efb\u547d\u9996\u76f8\u548c\u5185\u9601\uff1b\u653f\u515a\u4ecd\u53d7\u7981\u9650\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u63d0\u51fa\u201c\u548c\u5e73\u533a\u201d\u3001\u9650\u5236\u5916\u56fd\u4eba\u5728\u5c3c\u5c31\u4e1a\uff0c\u5e76\u53d1\u5c55\u540c\u4e2d\u56fd\u7684\u5de5\u7a0b\u548c\u519b\u8d38\u5173\u7cfb\uff1b\u8fd9\u003cbr\u003e\u4e9b\u653f\u7b56\u4f7f\u5c3c\u5370\u77db\u76fe\u9010\u6b65\u4e0a\u5347\u3002\u003cbr\u003e\u6bd4\u5170\u5fb7\u62c9\u65f6\u671f\u738b\u5ba4\u653f\u6743\u5ef6\u7eed\uff1b\u4e66\u4e2d\u628a1975\u5e74\u201c\u548c\u5e73\u533a\u201d\u4e3b\u5f20\u30011987\u5e74\u5916\u56fd\u4eba\u5c31\u003cbr\u003e\u4e1a\u8bb8\u53ef\u548c\u5c3c\u4e2d\u5408\u4f5c\u5217\u4e3a\u5c3c\u5370\u5173\u7cfb\u7d27\u5f20\u7684\u80cc\u666f\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\uff0f\u738b\u5ba4\u653f\u5e9c\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u56fd\u738b\u638c\u63e1\u56fd\u5bb6\u6743\u529b\uff0c\u9a6c\u91cc\u5947\u00b7\u66fc\u00b7\u8f9b\u683c\u4efb\u9996\u76f8\uff1b1990\u5e74\u6297\u8bae\u6269\u5927\u540e\u6539\u4efb\u6d1b\u003cbr\u003e\u80af\u5fb7\u62c9\u00b7\u5df4\u54c8\u675c\u5c14\u00b7\u660c\u5fb7\uff0c\u6700\u7ec8\u540c\u610f\u7ed3\u675f\u65e0\u515a\u6d3e\u4f53\u5236\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u4ee5\u8d38\u6613\u4e0e\u8fc7\u5883\u534f\u5b9a\u5230\u671f\u4e3a\u7531\u5173\u95ed\u5927\u90e8\u5206\u8fc7\u5883\u7ad9\uff0c\u5f62\u6210\u8d38\u6613\u7981\u8fd0\uff1b\u7ecf\u6d4e\u51b2\u51fb\u4e0e\u53cd\u738b\u5ba4\u003cbr\u003e\u8fd0\u52a8\u76f8\u4e92\u53e0\u52a0\u3002\u003cbr\u003e1989\u5e743\u670823\u65e5\u5370\u5ea6\u5173\u95ed\u5927\u90e8\u5206\u5c3c\u6cca\u5c14\u8fd0\u8f93\u8fc7\u5883\u7ad9\u30021990\u5e74\u6297\u8bae\u5347\u7ea7\u540e\uff0c\u6bd4\u003cbr\u003e\u5170\u5fb7\u62c9\u540c\u610f\u89e3\u9664\u515a\u7981\u3001\u89e3\u6563\u738b\u5ba4\u653f\u5e9c\u5e76\u4e3e\u884c\u5927\u9009\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u591a\u515a\u8054\u5408\u4e34\u65f6\u653f\u5e9c\uff0f\u5df4\u7279\u62c9\u4f0a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u6bd4\u5170\u5fb7\u62c9\u8f6c\u4e3a\u7acb\u5baa\u56fd\u738b\uff1b\u5927\u4f1a\u515a\u4e3b\u5e2d\u514b\u00b7\u666e\u00b7\u5df4\u7279\u62c9\u4f0a\u9886\u5bfc\u7531\u5927\u4f1a\u515a\u3001\u5de6\u7ffc\u8054\u5408\u9635\u7ebf\u3001\u003cbr\u003e\u738b\u5ba4\u63d0\u540d\u8005\u548c\u77e5\u8bc6\u5206\u5b50\u7ec4\u6210\u7684\u4e34\u65f6\u653f\u5e9c\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e1990\u5e746\u6708\u5df4\u7279\u62c9\u4f0a\u653f\u5e9c\u540c\u5370\u5ea6\u8fbe\u6210\u534f\u8bae\uff0c\u5370\u5ea6\u53d6\u6d88\u8d38\u6613\u7981\u8fd0\uff0c\u4e24\u56fd\u6062\u590d\u8d38\u6613\u4e0e\u8fc7\u003cbr\u003e\u5883\u5b89\u6392\u3002\u003cbr\u003e1990\u5e744\u6708\u56fd\u738b\u5e9f\u6b62\u65e0\u515a\u6d3e\u8bc4\u8bae\u4f1a\u5236\u5ea6\uff1b\u5df4\u7279\u62c9\u4f0a\u4e34\u65f6\u653f\u5e9c\u8d1f\u8d23\u8d77\u8349\u65b0\u5baa\u6cd5\u5e76\u7b79\u5907\u003cbr\u003e\u591a\u515a\u8bae\u4f1a\u9009\u4e3e\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u5927\u4f1a\u515a\u653f\u5e9c\uff0f\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5927\u4f1a\u515a\u5728205\u5e2d\u4e2d\u8d62\u5f97110\u5e2d\uff0c\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u4efb\u9996\u76f8\uff1b\u6bd4\u5170\u5fb7\u62c9\u4e3a\u7acb\u5baa\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u4e66\u4e2d\u8ba4\u4e3a\u653f\u5e9c\u5bf9\u5916\u653f\u7b56\u4ecd\u501a\u4ed7\u5370\u5ea6\uff1b\u653f\u5e9c\u9700\u5904\u7406\u5c3c\u5370\u7ecf\u6d4e\u50f5\u5c40\uff0c\u5e76\u5ef6\u7eed\u4e0e\u5370\u5ea6\u7684\u8d38\u6613\u548c\u003cbr\u003e\u8fc7\u5883\u5b89\u6392\u3002\u003cbr\u003e\u5927\u4f1a\u515a\u653f\u5e9c\u5b9e\u884c\u81ea\u7531\u653e\u4efb\u548c\u79c1\u6709\u5316\u653f\u7b56\u3002\u4e66\u4e2d\u628a\u7ecf\u6d4e\u5371\u673a\u3001\u4eb2\u5370\u653f\u7b56\u53ca\u672a\u80fd\u5151\u73b0\u6539\u5584\u6c11\u003cbr\u003e\u751f\u7684\u627f\u8bfa\u5217\u4e3a\u6c11\u4f17\u4e0d\u6ee1\u7684\u91cd\u8981\u539f\u56e0\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u653f\u5e9c\uff0f\u963f\u8fea\u5361\u91cc\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u6210\u4e3a\u8bae\u4f1a\u7b2c\u4e00\u5927\u515a\uff0c\u66fc\u00b7\u83ab\u6c49\u00b7\u963f\u8fea\u5361\u91cc\u5728\u56fd\u738b\u9080\u8bf7\u4e0b\u7ec4\u6210\u5c11\u6570\u6d3e\u653f\u003cbr\u003e\u5e9c\u5e76\u4efb\u9996\u76f8\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u653f\u5e9c\u8bd5\u56fe\u7ea0\u6b63\u524d\u4e00\u5c4a\u653f\u5e9c\u7684\u4eb2\u5370\u653f\u7b56\uff0c\u4f46\u4e66\u4e2d\u8ba4\u4e3a\u4ecd\u65e0\u6cd5\u6446\u8131\u5370\u5ea6\u5f71\u54cd\u3002\u003cbr\u003e1994\u5e7411\u6708\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u7ec4\u6210\u5c11\u6570\u6d3e\u653f\u5e9c\uff1b1995\u5e749\u6708\u5927\u4f1a\u515a\u8054\u5408\u5176\u4ed6\u003cbr\u003e\u515a\u6d3e\u901a\u8fc7\u4e0d\u4fe1\u4efb\u6848\uff0c\u963f\u8fea\u5361\u91cc\u653f\u5e9c\u4e0b\u53f0\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u5927\u4f1a\u515a\u8054\u5408\u653f\u5e9c\uff0f\u5fb7\u4e4c\u5e15\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u8c22\u5c14\u00b7\u5df4\u54c8\u675c\u5c14\u00b7\u5fb7\u4e4c\u5e15\u9886\u5bfc\u5927\u4f1a\u515a\u8054\u5408\u653f\u5e9c\uff1b\u5176\u540e\u8bae\u4f1a\u653f\u5e9c\u591a\u6b21\u66f4\u8fed\uff0c\u6bd4\u5170\u5fb7\u62c9\u4ecd\u4e3a\u003cbr\u003e\u7acb\u5baa\u56fd\u738b\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e1996\u5e74\u521d\u653f\u5e9c\u540c\u5370\u5ea6\u7b7e\u7f72\u9a6c\u54c8\u5361\u5229\u6cb3\u7efc\u5408\u5f00\u53d1\u6761\u7ea6\uff1b\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u201c40\u70b9\u8981\u6c42\u201d\u003cbr\u003e\u628a\u5e9f\u9664\u5bf9\u5370\u4e0d\u5e73\u7b49\u6761\u7ea6\u3001\u7ba1\u5236\u5f00\u653e\u8fb9\u754c\u5217\u4e3a\u6c11\u65cf\u95ee\u9898\u3002\u003cbr\u003e1995\u5e749\u6708\u5927\u4f1a\u515a\u91cd\u65b0\u7ec4\u9601\u5e76\u5bf9\u6fc0\u8fdb\u5de6\u6d3e\u91c7\u53d6\u5f3a\u786c\u63aa\u65bd\uff1b\u540c\u5e7411\u6708\u53d1\u52a8\u201c\u7f57\u5bc6\u6b27\u003cbr\u003e\u884c\u52a8\u201d\uff0c1996\u5e742\u6708\u4eba\u6c11\u6218\u4e89\u7206\u53d1\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u8d3e\u5357\u5fb7\u62c9\u56fd\u738b\uff0f\u8bae\u4f1a\u653f\u5e9c\u53d7\u538b\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u8d3e\u5357\u5fb7\u62c9\u7ee7\u4f4d\uff1b\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u3001\u5fb7\u4e4c\u5e15\u7b49\u5148\u540e\u4efb\u9996\u76f8\u30022002\u5e74\u540e\u56fd\u738b\u89e3\u6563\u8bae\u4f1a\u003cbr\u003e\u5e76\u4efb\u547d\u653f\u5e9c\uff0c\u738b\u6743\u4e0d\u65ad\u6269\u5f20\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u201c9\u00b711\u201d\u540e\u5370\u5ea6\u516c\u5f00\u628a\u5c3c\u5171\uff08\u6bdb\uff09\u89c6\u4e3a\u6050\u6016\u7ec4\u7ec7\u3001\u52a0\u5f3a\u8fb9\u5883\u90e8\u7f72\uff0c\u5e76\u4e0e\u7f8e\u56fd\u4e00\u9053\u652f\u003cbr\u003e\u6301\u5c3c\u6cca\u5c14\u653f\u5e9c\u4ee5\u6b66\u529b\u5e94\u5bf9\u5c3c\u5171\uff08\u6bdb\uff09\u3002\u003cbr\u003e2001\u5e74\u738b\u5bab\u8840\u6848\u540e\u8d3e\u5357\u5fb7\u62c9\u7ee7\u4f4d\u3002\u548c\u8c08\u7834\u88c2\u540e\uff0c\u738b\u5ba4\u3001\u653f\u5e9c\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u6218\u4e89\u5347\u003cbr\u003e\u7ea7\uff0c\u56fd\u738b\u9010\u6b65\u6269\u5927\u5bf9\u653f\u5e9c\u548c\u519b\u961f\u7684\u63a7\u5236\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u8d3e\u5357\u5fb7\u62c9\u56fd\u738b\u76f4\u63a5\u7edf\u6cbb\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u8d3e\u5357\u5fb7\u62c9\u89e3\u9664\u653f\u5e9c\u5e76\u5b9e\u884c\u76f4\u63a5\u7edf\u6cbb\uff1b\u4e03\u515a\u8054\u76df\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u8f6c\u5411\u8054\u5408\u53cd\u5bf9\u738b\u6743\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u4e0d\u652f\u6301\u56fd\u738b\u957f\u671f\u76f4\u63a5\u7edf\u6cbb\uff1b\u4e03\u515a\u8054\u76df\u4e0e\u5c3c\u5171\uff08\u6bdb\uff09\u7684\u63a5\u89e6\u548c\u201c\u5341\u4e8c\u70b9\u534f\u8bae\u201d\u5728\u5370\u5ea6\u003cbr\u003e\u8fdb\u884c\uff0c\u5370\u5ea6\u6210\u4e3a\u548c\u8c08\u4e0e\u6743\u529b\u91cd\u7ec4\u7684\u91cd\u8981\u5916\u90e8\u573a\u57df\u3002\u003cbr\u003e2005\u5e74\u56fd\u738b\u653f\u53d8\u540e\uff0c\u5c3c\u5171\uff08\u6bdb\uff09\u540c\u4e03\u515a\u8054\u76df\u9010\u6b65\u5f62\u6210\u53cd\u738b\u6743\u5408\u4f5c\uff1b2006\u5e74\u4eba\u6c11\u003cbr\u003e\u8fd0\u52a8\u8feb\u4f7f\u56fd\u738b\u6062\u590d\u8bae\u4f1a\u5e76\u4ea4\u8fd8\u6743\u529b\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u4e03\u515a\u8054\u76df\u653f\u5e9c\uff0f\u67ef\u4f0a\u62c9\u814a\u9996\u76f8\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5409\u00b7\u666e\u00b7\u67ef\u4f0a\u62c9\u814a\u9886\u5bfc\u4e03\u515a\u8054\u76df\u653f\u5e9c\uff1b\u56fd\u738b\u6743\u529b\u88ab\u89e3\u9664\u3002\u5c3c\u5171\uff08\u6bdb\uff09\u7b7e\u7f72\u548c\u5e73\u534f\u8bae\u3001\u8fdb\u003cbr\u003e\u5165\u4e34\u65f6\u8bae\u4f1a\u5e76\u53c2\u52a0\u4e34\u65f6\u653f\u5e9c\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u652f\u6301\u8bae\u4f1a\u6c11\u4e3b\u6846\u67b6\uff0c\u540c\u65f6\u5bc6\u5207\u5f71\u54cd\u548c\u5e73\u8fdb\u7a0b\uff1b\u5c3c\u5171\uff08\u6bdb\uff09\u4e0e\u5370\u5ea6\u4e4b\u95f4\u4ece\u6b66\u88c5\u65f6\u671f\u7684\u003cbr\u003e\u538b\u5236\u8f6c\u4e3a\u516c\u5f00\u653f\u6cbb\u4ea4\u5f80\u3002\u003cbr\u003e2006\u5e74\u4e03\u515a\u8054\u76df\u638c\u6743\u540e\u540c\u5c3c\u5171\uff08\u6bdb\uff09\u5c55\u5f00\u7b2c\u4e09\u6b21\u548c\u8c08\uff0c\u7b7e\u7f72\u548c\u5e73\u534f\u8bae\uff1b\u4e34\u65f6\u5baa\u6cd5\u628a\u003cbr\u003e\u56fd\u5bb6\u5143\u9996\u804c\u80fd\u6682\u4ea4\u9996\u76f8\u884c\u4f7f\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u5c3c\u5171\uff08\u6bdb\uff09\u8054\u5408\u653f\u5e9c\uff0f\u666e\u62c9\u660c\u8fbe\u603b\u7406\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5236\u5baa\u8bae\u4f1a\u5e9f\u9664\u738b\u6743\u5e76\u5efa\u7acb\u5171\u548c\u56fd\uff1b\u5c3c\u5171\uff08\u6bdb\uff09\u4e3a\u7b2c\u4e00\u5927\u515a\uff0c\u666e\u62c9\u660c\u8fbe\u9886\u5bfc\u8054\u5408\u653f\u5e9c\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u65b0\u653f\u5e9c\u8c0b\u6c42\u5728\u4e2d\u56fd\u548c\u5370\u5ea6\u4e4b\u95f4\u4fdd\u6301\u5e73\u8861\uff1b\u519b\u961f\u95ee\u9898\u4ee5\u53ca\u666e\u62c9\u660c\u8fbe\u540c\u5370\u5ea6\u7684\u4e92\u4fe1\u4e0d\u8db3\u6210\u4e3a\u003cbr\u003e\u6267\u653f\u538b\u529b\u7684\u4e00\u90e8\u5206\u3002\u003cbr\u003e2008\u5e74\u5236\u5baa\u8bae\u4f1a\u9009\u4e3e\u540e\u5c3c\u5171\uff08\u6bdb\uff09\u6210\u4e3a\u7b2c\u4e00\u5927\u515a\uff0c\u666e\u62c9\u660c\u8fbe\u51fa\u4efb\u603b\u7406\uff1b\u4e0d\u8db3\u4e5d\u4e2a\u6708\u003cbr\u003e\u540e\u8f9e\u804c\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u4e3b\u5bfc\u653f\u5e9c\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u666e\u62c9\u660c\u8fbe\u8f9e\u804c\u540e\uff0c\u9a6c\u8fbe\u592b\u00b7\u5e93\u9a6c\u5c14\u00b7\u5c3c\u5e15\u5c14\u9886\u5bfc\u8054\u5408\u653f\u5e9c\uff1b\u5176\u540e\u6770\u62c9\u00b7\u7eb3\u7279\u00b7\u5361\u7eb3\u5c14\u7ec4\u003cbr\u003e\u9601\u3002\u003cbr\u003e\u003cb\u003e\u5bf9\u5370\u5173\u7cfb\uff1a\u003c\u002fb\u003e\u5370\u5ea6\u7ee7\u7eed\u5f71\u54cd\u5404\u515a\u8054\u76df\u3001\u548c\u5e73\u8fdb\u7a0b\u548c\u5b89\u5168\u653f\u7b56\uff1b\u4e66\u4e2d\u5c06\u5176\u89c6\u4e3a\u5236\u7ea6\u5c3c\u5171\uff08\u6bdb\uff09\u91cd\u65b0\u6267\u653f\u003cbr\u003e\u7684\u91cd\u8981\u5916\u90e8\u529b\u91cf\u3002\u003cbr\u003e\u5c3c\u5171\uff08\u6bdb\uff09\u9000\u51fa\u653f\u5e9c\u540e\u6210\u4e3a\u53cd\u5bf9\u515a\uff0c\u5c3c\u5171\uff08\u8054\u5408\u9a6c\u5217\uff09\u5148\u540e\u9886\u5bfc\u4e24\u5c4a\u653f\u5e9c\uff0c\u653f\u5c40\u56f4\u7ed5\u548c\u003cbr\u003e\u5e73\u8fdb\u7a0b\u3001\u5236\u5baa\u548c\u519b\u961f\u6574\u7f16\u6301\u7eed\u50f5\u6301\u3002\u003cextra\u003e\u003c\u002fextra\u003e"],["\u003cb\u003e\u7edf\u4e00\u5c3c\u5171\uff08\u6bdb\uff09\u653f\u5e9c\uff0f\u5df4\u7279\u62c9\u4f0a\u603b\u7406\u003c\u002fb\u003e\u003cbr\u003e\u003cb\u003e\u5f53\u6743\u8005\uff1a\u003c\u002fb\u003e\u5df4\u5e03\u62c9\u59c6\u00b7\u5df4\u7279\u62c9\u4f0a\u5728\u9a6c\u8fea\u897f\u653f\u515a     }
    const stageOpacity = item => opacityForRelated(item.related_person_ids || []);
    const stageShapeOpacities = (stageMeta.focus_stage_shapes || []).map(stageOpacity);
    const stageAnnotationOpacities = (stageMeta.focus_stage_annotations || []).map(stageOpacity);
    const branchAnnotationOpacities = (stageMeta.focus_branch_annotations || []).map(stageOpacity);
    const stageSignature = stageShapeOpacities.concat(stageAnnotationOpacities, branchAnnotationOpacities).join(',');
    if (stageSignature !== lastStageSignature) {
      lastStageSignature = stageSignature;
      const updates = {};
      (stageMeta.focus_stage_shapes || []).forEach((item, at) => {
        updates[`shapes[${item.index}].opacity`] = stageShapeOpacities[at];
      });
      (stageMeta.focus_stage_annotations || []).forEach((item, at) => {
        updates[`annotations[${item.index}].opacity`] = stageAnnotationOpacities[at];
      });
      (stageMeta.focus_branch_annotations || []).forEach((item, at) => {
        updates[`annotations[${item.index}].opacity`] = branchAnnotationOpacities[at];
      });
      if (Object.keys(updates).length) Plotly.relayout(gd, updates);
    }
    if (selected.length) {
      status.textContent = '人物 100%：' + selected.map(id => people.find(p => p.id === id).name).join('；') +
        (selectedLane ? '；组织 60%：' + (laneOptions.find(l => l.id === selectedLane) || {}).name : '');
    } else if (hovered) {
      status.textContent = '人物 100%：' + people.find(p => p.id === hovered).name +
        (selectedLane ? '；组织 60%：' + (laneOptions.find(l => l.id === selectedLane) || {}).name : '');
    } else if (selectedLane) {
      status.textContent = '组织 60%：' + (laneOptions.find(l => l.id === selectedLane) || {}).name;
    } else {
      status.textContent = '当前：全部人物（20%）';
    }
  }
  function setSelectedLane(id) {
    selectedLane = id || null;
    laneSelect.value = selectedLane || '';
    update();
  }
  function togglePerson(id, shift) {
    if (!id) return;
    if (compareMode || shift) {
      const at = selected.indexOf(id);
      if (at >= 0) selected.splice(at, 1);
      else if (selected.length < 3) selected.push(id);
      else status.textContent = '对比最多选择 3 人，请先取消一人。';
    } else {
      if (selected.length === 1 && selected[0] === id) selected.splice(0, 1);
      else { selected.splice(0, selected.length, id); }
    }
    update();
  }
  function resetViewAndControls(nextSelection, clearLane = true) {
    selected.splice(0, selected.length, ...nextSelection);
    hovered = null;
    compareMode = false;
    if (clearLane) {
      selectedLane = null;
      laneSelect.value = '';
    }
    search.value = '';
    compareButton.textContent = '比较模式：关';
    compareButton.setAttribute('aria-pressed', 'false');
    gd.__focusShiftClick = false;
    if (Plotly.Fx && typeof Plotly.Fx.unhover === 'function') Plotly.Fx.unhover(gd);
    update();
    const axisReset = {};
    if (initialXRange) axisReset['xaxis.range'] = initialXRange.slice();
    if (initialYRange) axisReset['yaxis.range'] = initialYRange.slice();
    if (Object.keys(axisReset).length) Plotly.relayout(gd, axisReset);
    window.scrollTo(0, 0);
  }
  function resetToDefault() { resetViewAndControls(defaultSelection); }
  function showAllPeople() {
    resetViewAndControls([], false);
  }
  search.addEventListener('change', () => {
    const id = personFromName(search.value);
    if (id) { selected.splice(0, selected.length, id); update(); }
  });
  laneSelect.addEventListener('change', () => setSelectedLane(laneSelect.value));
  rail.querySelector('#focus-reset').addEventListener('click', showAllPeople);
  compareButton.addEventListener('click', () => {
    compareMode = !compareMode;
    compareButton.textContent = '比较模式：' + (compareMode ? '开' : '关');
    compareButton.setAttribute('aria-pressed', String(compareMode));
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); resetToDefault(); }
  });
  gd.addEventListener('click', event => { gd.__focusShiftClick = event.shiftKey; }, true);
  gd.addEventListener('click', event => {
    const tick = event.target && event.target.closest ? event.target.closest('.xaxislayer-above .xtick') : null;
    if (!tick) return;
    const ticks = Array.from(gd.querySelectorAll('.xaxislayer-above .xtick'));
    const index = ticks.indexOf(tick);
    const laneId = axisLaneIds[index];
    if (laneId && laneOptions.some(item => item.id === laneId)) setSelectedLane(selectedLane === laneId ? null : laneId);
  });
  gd.on('plotly_hover', eventData => {
    const point = eventData.points && eventData.points[0];
    const trace = point && gd.data[point.curveNumber];
    hovered = trace && trace.meta ? trace.meta.person_id || null : null;
    update();
  });
  gd.on('plotly_unhover', () => { hovered = null; update(); });
  gd.on('plotly_click', eventData => {
    const points = eventData.points || [];
    const personPoint = points.find(point => {
      const trace = gd.data[point.curveNumber];
      return trace && trace.meta && trace.meta.person_id;
    });
    const relationPoint = points.find(point => {
      const trace = gd.data[point.curveNumber];
      return trace && trace.meta && Array.isArray(trace.meta.related_person_ids);
    });
    const lanePoint = points.find(point => {
      const trace = gd.data[point.curveNumber];
      return trace && trace.meta && trace.meta.organization_lane_hit_area && point.customdata;
    });
    if (personPoint) {
      const trace = gd.data[personPoint.curveNumber];
      togglePerson(trace.meta.person_id, Boolean(gd.__focusShiftClick));
    } else if (relationPoint) {
      // Preserve organization split/merge line behavior; it is not a lane hit.
    } else if (lanePoint) {
      const laneId = lanePoint.customdata;
      setSelectedLane(selectedLane === laneId ? null : laneId);
    } else {
      const point = points[0];
      const trace = point && gd.data[point.curveNumber];
      togglePerson(trace && trace.meta ? trace.meta.person_id : null, Boolean(gd.__focusShiftClick));
    }
    gd.__focusShiftClick = false;
  });
  update();
})();

                        })                };            </script>        </div>
